# Physiological tolerance envelopes for the Trees to Seas suitability engine.
#
# Each factor is a trapezoidal membership function with FOUR breakpoints:
#     [lo_zero, lo_one, hi_one, hi_zero]
#   suitability = 0 at/below lo_zero -> ramps to 1 by lo_one -> holds 1 to hi_one
#               -> ramps to 0 by hi_zero (0 at/above hi_zero).
#   One-sided "more is better" factors (DO, pH) set hi_one/hi_zero far above any
#   observed value, so suitability plateaus at 1.
#
# v0.2 -- values are LITERATURE-CALIBRATED and adversarially fact-checked.
# Per-factor `tags` mark NC-specific vs. transferred; `citations` give the source;
# `caveats` record life-stage dependence and soft endpoints. Full table + sources:
# docs/tolerance_table.md. Treat transferred values as provisional and revisit with
# NC-specific data where possible (esp. blue crab, all transferred).

eastern_oyster:
  common_name: "Eastern oyster"
  scientific_name: "Crassostrea virginica"
  anchor: true
  factors:
    temp_C: [-2, 20, 30, 36]
    salinity_ppt: [2, 14, 30, 40]
    DO_mgL: [1, 4, 1000, 2000]
    pH: [7.5, 8, 100, 200]
  degree_days:
    base_C: 20
    event: "spawning_onset"
  tags:
    temp_C: "transferred"
    salinity_ppt: "NC-specific"
    DO_mgL: "NC-specific"
    pH: "transferred"
    degree_days: "transferred"
  citations:
    temp_C: "Lower opt 20 / upper opt 30 C: LA Coastal Master Plan Eastern Oyster HSI (Hijuelos et al. 2016, citing Pattillo et al. 1995 & Stanley & Sellers 1986) [Gulf]; NC growing range 10-30 C: NC CHPP 2005 Ch.3 p.202 (citing Burrell 1986, Castagna & Chanley 1973) [NC-specific]. Upper lethal ~36 C: Marshall, Coxe, La Peyre et al. 2021, J. Thermal Biology 100:103072 (3-day LD50 35-36 C at 4 ppt, rising to 40-44 C at 20 ppt) [Gulf/lab]. Lower bound -2 C: coarse intertidal/eurythermal survival bound, Animal Diversity Web + overwintering literature [transferred]."
    salinity_ppt: "Optimum 14-30 ppt (spat/adults): NC CHPP 2005 p.202 (citing Castagna & Chanley 1973) [NC-specific]; lower lethal ~2 ppt and upper ~40 ppt adult survival envelope: LA HSI Table 1 (Pattillo et al. 1995, adult range 2-43.5 ppt) [Gulf]; upper optimum effectively capped near 30 ppt by predation/disease above ~15 ppt (Perkinsus, oyster drills)."
    DO_mgL: "Lethal ~1 mg/L (1-2 mg/L lethal-to-harmful band): NC CHPP 2005 p.202 [NC-specific]; saturating ~4 mg/L ('requires ~4 mg/L for proper physiological function'): general/lab rule-of-thumb, Keppel et al. 2016 PLOS ONE 11:e0161088 normoxia >5 mg/L [transferred, weakly sourced]."
    pH: "Stress/dissolution onset ~7.5 (calcification declines with ~0.5-unit drop, net dissolution at lowest pH) and adequate ~8.0 (control where calcification maintained): Waldbusser, Voigt, Bergschneider, Green & Newell 2011, Estuaries & Coasts 34:221-231 [Chesapeake/lab]; larval performance governed by aragonite saturation (Omega_arag<1): Waldbusser et al. 2015 Nat. Clim. Change 5:273-280; Gray et al. 2020 J. Molluscan Stud. 86:342-353 [lab]."
    degree_days: "Base 20 C, spawning onset: spawning initiated >~20 C, mass spawning >~25 C: EOBRT 2007 NOAA Tech. Memo NMFS F/SPO-88; Banks et al. 2007; Stanley & Sellers 1986; northern pops spawn 15.5-20 C, southern require >20 C [transferred/general]."
  caveats: "ANCHOR species (paired mortality + growth data). NC-specific values exist only for the broad envelopes: growing temp 10-30 C, optimum salinity 14-30 ppt, and DO <1-2 mg/L lethal (all NC CHPP 2005). The salinity optimum and DO lethal threshold are genuinely NC-derived; the temperature optimum/upper-lethal, the DO saturating value (~4 mg/L), and ALL pH/aragonite thresholds are transferred from Gulf, Chesapeake, or lab studies. CITATION CORRECTION: Marshall et al. 2021 is J. Thermal Biology 100:103072 (NOT Mar. Environ. Res. 168:105322 as originally listed). Verifier flags three soft endpoints: (1) upper lethal 36 C is salinity-DEPENDENT (acutely lethal only at low salinity ~4 ppt; rises to 40-44 C at 20 ppt) and the authors say the upper critical limit 'is not well defined' - 36 C used here as a CONSERVATIVE upper-lethal floor; (2) DO saturating 4 mg/L is a round-number management rule, not a measured threshold (experimental normoxia controls were >5 mg/L) - conservative; (3) lower lethal -2 C is a coarse intertidal bound, not a measured LT (adults overwinter at -1 to 0 C for months). LIFE-STAGE: tolerance increases gametes<embryos<larvae<spat<adults; larvae/spat have NARROWER salinity tolerance (larval optimum ~8-15 ppt vs adult 15-30), are far more hypoxia-sensitive (larval anoxia LT50 ~11-51 h vs ~150 h juveniles; Baker & Mann 1992), and earliest embryonic stages are most acidification-vulnerable. Realized NC stress is concentrated on the larval/spat recruitment bottleneck (low-salinity x high-summer-temp + diel-cycling hypoxia in shallow estuaries), not adults on the reef. DO and pH are modeled one-sided (more-is-better)."

blue_crab:
  common_name: "Blue crab"
  scientific_name: "Callinectes sapidus"
  anchor: false
  factors:
    temp_C: [10, 20, 30, 36]
    salinity_ppt: [0, 3, 30, 60]
    DO_mgL: [2.4, 4, 1000, 2000]
    pH: [7.3, 7.9, 100, 200]
  degree_days:
    base_C: 10.8
    event: "molt_growth_onset"
  tags:
    temp_C: "transferred (NC-grounded lower shoulder)"
    salinity_ppt: "transferred"
    DO_mgL: "transferred (NC-grounded avoidance shoulder)"
    pH: "transferred"
    degree_days: "transferred"
  citations:
    temp_C: "ACTIVE-OCCURRENCE envelope (not survival). Lower shoulder ~10 C = growth cessation + sediment burial/dormancy (buried crabs present but uncatchable): Cadman & Weinstein 1988 JEMBE 121:193-207 via NC DMF Blue Crab FMP Amendment 2 (2013); Epifanio 2019 J. Shellfish Res. 38:1-22. Optimum growth ~15-30 C; upper ~36 C conservative sustained-field limit (acute CTmax 35-41 C, acclimation-dependent): Tagatz 1969 TAFS 98:713-716 [Chesapeake/Gulf/lab; NC-grounded dormancy threshold]."
    salinity_ppt: "Lower lethal 0 ppt (survives fresh; CTmin=0 psu): Sci. Total Environ. 2024 (S0048969724064477). Adult osmoregulatory optimum ~3-15 psu, growth optimum band ~3-30 ppt: Rome et al. 2005; lagoon optima 5-30 psu: Sci. Total Environ. 2024. Upper limit ~60 ppt (conservative; CTmax 62.4 psu, records to ~117 g/L Laguna Madre): Sci. Total Environ. 2024 [Gulf/Mediterranean/lab]."
    DO_mgL: "Behavioral-AVOIDANCE shoulder ~2.4-4 mg/L: crabs leave bottom water below ~2.4 mg/L and increase movement ~45% air-sat (~3.4 mg/L), relocating to oxygenated shallows rather than occupying hypoxia -- so DO marks where crabs are NOT: Selberg et al. 2001 NAJFM 21:358-366 (NC Neuse); Bell, Eggleston & Wolcott 2003 MEPS 259:215-225; Bell, Eggleston & Noga 2009 [NC Neuse-grounded]. Resting-adult physiological Pcrit is far lower (~1.3-1.6 mg/L): Das & Stickle 1993; Brill et al. 2015 [survival floor != occupancy threshold]."
    pH: "Stress ~7.3 (low pH 7.16-7.33 cut 14-d zoeal survival ~49% alone, ~87% with low DO) and adequate ~7.9 (control 7.91-7.94): Tankersley/Miller et al. 2018 PLOS ONE 13:e0208629; adults/juveniles comparatively OA-resilient: Ries et al. 2009 Geology 37:1131-1134 [lab, Chesapeake/SE-US source crabs]."
    degree_days: "Base 10.8 C = growth-based temperature of torpor (Tmin); intermolt ~536 degree-days: Brylawski & Miller 2006, Can. J. Fish. Aquat. Sci. 63(6):1298-1308, doi:10.1139/f06-011 [lab; value exactly verified]."
  caveats: "KEY RESULT (Program 195, 4,312 tows): bottom T/S/DO suitability predicts adult crab occurrence only weakly pooled (rho=+0.16) and essentially NOT within-year (median rho=0.02, positive in 57% of years) -- and this is EXPECTED, not a tuning failure (verified by a dedicated research workflow). (1) SATURATION: 97% of tows fall in the salinity plateau [3,30] and 82% in the DO plateau (>=5 mg/L; Pamlico is well-mixed, median bottom DO 6.7 mg/L), so those axes are mathematically flat over the surveyed water and carry no within-year signal -- the pooled rho is a warm-season/among-year temperature artifact. (2) BIOLOGY: adult Callinectes sapidus is euryhaline, mobile, and sex-segregated (males low/mid-salinity, mature females migrate seaward to spawn; zoeae develop offshore), actively AVOIDS hypoxic bottom water (DO marks where crabs are NOT), and BURIES below ~10 C (present but uncatchable) -- none captured by a static bottom reading. TREAT THIS ENVELOPE AS A PHYSIOLOGICAL-TOLERANCE LAYER, NOT a tow-scale occurrence predictor. By contrast southern flounder (pinned to low-salinity fine sediment) tracks bottom conditions far better (within-year rho=0.15, 89% of years). Two NC-grounded realism refinements applied here (DO shoulder ->~2.4-4 mg/L; temp lower shoulder ->10 C); they improve fidelity but, as expected, not within-year prediction. CORRECT LONG-TERM PATH: a sex-/life-stage-/season-structured model (Program 195 provides sex- and recruit-stage CPUE; NC DMF 2018 stock assessment). HEMATODINIUM: salinity 26-30 ppt is physiologically fine but enables Hematodinium perezi transmission (peaks 26-30 ppt, absent <11 ppt; Messick & Shields 2000), so low-salinity reaches are disease refuges. All axes transferred except the NC-grounded DO/temp shoulders; pH one-sided."

southern_flounder:
  common_name: "Southern flounder"
  scientific_name: "Paralichthys lethostigma"
  anchor: false
  factors:
    temp_C: [2, 18, 25, 35]
    salinity_ppt: [0, 5, 15, 36]
    DO_mgL: [2, 6, 1000, 2000]
    pH: [7, 7.5, 100, 200]
  degree_days:
    base_C: 10
    event: "juvenile_growth"
  tags:
    temp_C: "NC-specific"
    salinity_ppt: "NC-specific"
    DO_mgL: "NC-specific"
    pH: "transferred"
    degree_days: "transferred"
  citations:
    temp_C: "Lower lethal 2 C (chronic limit between 2-4 C; mortality 30-100% at 2 C vs 0-10% at 4 C, mitigated by salinity): Taylor, W.E., Tomasso, Kempton & Smith 2000, J. World Aquaculture Soc. 31(1):69-72 [SE-US/lab]; NC field anchor: juveniles in NC estuaries at 2-4 C, Williams & Deubler 1968 (in Flowers et al. 2019 NC DMF) [NC-specific]. Lower/upper optimum 18-25 C nursery/field bracket: FishBase preferred 23.2-24.9 C; Luckenbach et al. 2007 Comp. Biochem. Physiol. A (23 C grew 65-83% larger than 28 C) [NC fish]; lab maximal-growth ~29 C: Del Toro-Silva et al. 2008 JEMBE 358:113-123 [NC fish]. Upper ~35 C occurrence/culture-derived (no measured CTmax exists) [transferred]."
    salinity_ppt: "Lower lethal 0 ppt = survivable but suboptimal (juveniles ~100% survival 0-10 ppt; enter freshwater): Smith et al. 1999; Flowers et al. 2019 NC DMF (citing Burke et al. 1991). Optimum 5-15 ppt ('thrive in 5-15 ppt'): Flowers et al. 2019 NC DMF (citing Deubler 1960; Stickney & White 1973) [NC-specific]; coastal freshwater not optimal, growth higher in meso/polyhaline: Rulifson et al. 2009. Upper ~36 ppt = full-seawater tolerance bound for adults/larvae (culture to 32 ppt) [transferred/occurrence]."
    DO_mgL: "Lethal/avoidance ~2 mg/L (juveniles avoid DO <~2 mg/L; negative growth at 1.75 mg/L): Taylor & Miller 2001 JEMBE 258:195-214 (NC Pamlico/Neuse juveniles); Del Toro-Silva et al. 2008 JEMBE 358:113-123 [NC-specific]. Saturating ~6 mg/L (DO limits GROWTH up to near air-saturation: 6.00->4.00 mg/L cut growth ~50% at 29 C): Del Toro-Silva et al. 2008 [NC-specific]."
    pH: "NO species-specific pH thresholds exist (none in NC DMF, SEDAR/ASMFC, NOAA EFH, or physiology literature; Flowers et al. 2019 discusses water-quality generally with no pH values). Values shown are a transferred generic estuarine-fish lower bound (lo_zero 7.0 / lo_one 7.5) to keep the envelope functional; pH is NOT a reported limiting factor for this species [transferred/placeholder]."
    degree_days: "NO published degree-day base temperature located for P. lethostigma. base_C=10 C is a transferred placeholder chosen between the ~2-4 C cold limit and the ~23-29 C growth optimum to keep the juvenile-growth accumulator functional; it is NOT a measured developmental base [transferred/placeholder]."
  caveats: "Best-anchored of the finfish: temperature, salinity, and DO are genuinely NC-specific (NC fish, NC State labs, NC DMF), weighted to estuarine-dependent JUVENILES. EXCEPTIONS flagged transferred: upper-lethal temp ~35 C and upper-salinity ~36 ppt are occurrence/aquaculture-range bounds (no measured CTmax; culture documented to 32 ppt), and pH + degree-day base have NO citable species value (placeholders supplied only to satisfy the 4-number / numeric schema; do NOT treat as measured). CITATION CORRECTION: the cold-tolerance paper is Taylor, W.E., Tomasso, Kempton & Smith 2000, J. World Aquaculture Soc. 31(1):69-72 - NOT 'J.C. Taylor, J.M. Miller ... 31(4)' (the original conflated it with the unrelated NC State J.C. Taylor/J.M. Miller hypoxia group); consequently the experimental 2-4 C limit used SC-lineage hatchery fish (partly transferred) while the NC anchor for 2-4 C is the Williams & Deubler 1968 field record. NOTE the DO saturating value (~6 mg/L) reflects GROWTH limitation, not survival, and is temperature-dependent (pronounced at 29 C, not at 27 C). LIFE-STAGE: low-salinity optimum (5-15 ppt) applies to juveniles; eggs/larvae are oceanic (enter NC inlets Nov-Apr at high salinity) and adults move back to higher salinity/offshore to spawn. TEMPERATURE-DEPENDENT SEX DETERMINATION (fitness, not survival): extreme warm (>27-28 C) and cool (~18 C) masculinize juveniles, ~23 C yields ~1:1 (Luckenbach et al.; Honeycutt et al. 2019). DO and pH modeled one-sided (more-is-better)."

atlantic_croaker:
  common_name: "Atlantic croaker"
  scientific_name: "Micropogonias undulatus"
  anchor: false
  factors:
    temp_C: [1, 25, 28, 38]
    salinity_ppt: [0, 5, 20, 75]
    DO_mgL: [2, 4, 1000, 2000]
    pH: [6, 6.5, 100, 200]
  degree_days:
    base_C: 10
    event: "juvenile_growth"
  tags:
    temp_C: "transferred"
    salinity_ppt: "transferred"
    DO_mgL: "NC-specific"
    pH: "transferred"
    degree_days: "transferred"
  citations:
    temp_C: "Lower lethal ~1 C (juveniles begin dying <33 F/1 C): SRAC Pub. 7208 (Sink 2011) [aquaculture; acute Gulf lab LT50 ~0.31 C, NAJFM 45(2):225 2025]. Adult cold limit ~3 C, upper lethal: adults >36 C / juveniles >38 C (>100 F): SRAC 7208. Optimum 25-28 C: SRAC 7208 (good growth 25-30 C); EDIS FA148 (most abundant >24 C, Miglarese et al. 1982); FishBase preferred mean 24.1 C; metabolic scope plateaus 25-30 C (JEMBE 2018) [transferred]. Ecological overwintering threshold ~4 C mean Jan-Feb: Montane & Austin (VIMS/Chesapeake)."
    salinity_ppt: "Lower lethal 0 ppt = tolerated when acclimated (freshwater survival 2+ days; >=2 g/L recommended in culture): SRAC 7208. Optimum 5-20 ppt (best growth ~5 g/L): SRAC 7208; Peterson/Lankford JEMBE (S0022098198001737). Upper limit 75 g/L = max field occurrence in hypersaline waters, NOT a measured lethal: SRAC 7208 (field range 0.2-75 g/L). Eggs need >=30 g/L for buoyancy [transferred]."
    DO_mgL: "Avoidance ~2 mg/L (demersal fish incl. croaker avoid DO <=2.3 mg/L; hypoxia-driven habitat compression): Eby & Crowder 2002, Can. J. Fish. Aquat. Sci. 59:952-965 (Neuse River Estuary, NC) [NC-specific]. Saturating ~4 mg/L is an UNSUPPORTED estimate (no published croaker no-effect DO concentration); limitation assumed to cease above the ~2-3 mg/L avoidance band [transferred/estimate]."
    pH: "Only datum: cultured pH 6.0-9.3 with LITTLE effect on growth ('little is known'): SRAC Pub. 7208. Breakpoints 6.0/6.5 are INTERPRETIVE endpoints from the low end of the tolerated range, NOT measured stress/lethal thresholds - note 6.0 itself was non-stressful in culture [transferred/interpretive]."
    degree_days: "NO degree-day developmental base reported in the reviewed literature. base_C=10 C is a transferred placeholder for the juvenile-growth accumulator (between the ~1-4 C cold limit and the ~25-28 C optimum); NOT a measured base [transferred/placeholder]."
  caveats: "Nearly all values transferred from mid-Atlantic/Chesapeake/Gulf/aquaculture work; the ONLY genuinely NC-specific datum is the ~2.0 mg/L DO avoidance/habitat-compression threshold from the Neuse River Estuary (Eby & Crowder 2002). KEY VERIFIER CORRECTIONS: (1) lower-lethal temp was originally 0.6 C - that value is UNSOURCED/fabricated precision; SRAC 7208 (the actual document behind the mis-cited 'ASMFC/ResearchGate 292159462' record) gives 1 C for juveniles, so corrected to 1 C (acute Gulf lab LT50 is ~0.3 C, a separate metric). Adult lower-lethal is best stated as 3 C, not 3.0-3.3. (2) DO lethal=2 is mislabeled - it is a behavioral AVOIDANCE/habitat-compression threshold (~2.3 mg/L), NOT a mortality LC50; nc_specific=true is justified for this NC datum. (3) DO saturating ~4 mg/L has NO primary support (admitted estimate) - treat as a modeling assumption. (4) pH 6.0 contradicts its source: croaker were cultured at 6.0-9.3 'with little effect on growth', so 6.0 is TOLERATED, not stressful - the 6.0/6.5 breakpoints are interpretive placeholders and pH is essentially non-limiting for this species. (5) NOTE the original-notes ~25% Gulf population-reduction-under-hypoxia figure could not be verified. ECOLOGICALLY the load-bearing limit is COLD: winter young-of-year kills drive recruitment; cold tolerance is SIZE- and SALINITY-dependent (increases with salinity; smaller individuals survive longer; Lankford & Targett 2001), and the relevant field cold limit is a sustained overwintering threshold (~3-4 C mean Jan-Feb) rather than the acute lab CTmin (~1 C). SALINITY optimum shifts ontogenetically (early juveniles ~5 ppt nurseries; eggs need >=30 ppt for buoyancy). REMINDER (project corrected-facts): croaker landings declines are NOT abundance declines - NC fishery-independent surveys show croaker remains among the most abundant estuarine fish. DO and pH modeled one-sided (more-is-better)."
