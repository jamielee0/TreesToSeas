[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treestoseas"
version = "0.1.0"
description = "Dynamic physiological-suitability engine for NC coastal fisheries (Trees to Seas)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "requests>=2.31",
    "scipy>=1.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
sources = ["erddapy>=2.2", "dataretrieval>=1.0", "noaa-coops>=0.4"]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["treestoseas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
